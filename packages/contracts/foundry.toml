# packages/contracts/foundry.toml
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]
gas_reports = ["TouristIdentityRegistry", "IncidentAnchor"]
ffi = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 24
fail_on_revert = false

[rpc_endpoints]
amoy = "${RPC_URL_PRIMARY}"
anvil = "${LOCAL_RPC_URL}"

[etherscan]
amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api", chain = 80002 }

[lint]
exclude_lints = [
  "unsafe-typecast",
  "unsafe-cheatcode",
  "mixed-case-variable",
  "screaming-snake-case-immutable",
]
